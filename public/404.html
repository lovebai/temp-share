<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 · TempShare</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,monospace;
    background:#0b0c0e;color:#c9d1d9;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    overflow-x:hidden;
  }
  ::selection{background:#58a6ff33}

  /* ── background glow ──────────────────────────── */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg::before{
    content:'';position:absolute;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle,#58a6ff14 0%,transparent 65%);
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .bg::after{
    content:'';position:absolute;width:100%;height:100%;
    background-image:
      linear-gradient(#30363d08 1px,transparent 1px),
      linear-gradient(90deg,#30363d08 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);
  }

  .container{position:relative;z-index:1;width:100%;max-width:560px;padding:24px}

  /* ── header ───────────────────────────────────── */
  .header{text-align:center;margin-bottom:28px}
  .header h1{
    font-size:22px;font-weight:600;color:#e6edf3;letter-spacing:-0.5px;
    display:inline-flex;align-items:center;gap:10px;
  }
  .header h1 .logo-dot{
    display:inline-block;width:14px;height:14px;border-radius:4px;
    background:linear-gradient(135deg,#58a6ff,#d2991d);
    box-shadow:0 0 14px #58a6ff55;
  }

  /* ── card ─────────────────────────────────────── */
  .card{
    background:#161b22;border:1px solid #30363d;border-radius:16px;
    padding:48px 40px 40px;text-align:center;position:relative;
    animation:cardIn .45s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,#58a6ff,transparent);
    border-radius:16px 16px 0 0;opacity:.6;
  }

  /* ── big 404 ──────────────────────────────────── */
  .big404{
    font-size:88px;font-weight:800;line-height:1;
    letter-spacing:-4px;margin-bottom:8px;user-select:none;
    background:linear-gradient(180deg,#e6edf3 20%,#58a6ff88 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    text-shadow:0 0 60px #58a6ff22;
  }

  /* ── icon ─────────────────────────────────────── */
  .magnifier{
    width:44px;height:44px;margin:0 auto 22px;position:relative;
    animation:sway 3.6s ease-in-out infinite;
  }
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .magnifier svg{width:100%;height:100%}

  /* ── status pill ──────────────────────────────── */
  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;color:#58a6ff;background:#1f6feb16;
    border:1px solid #58a6ff33;border-radius:6px;
    padding:6px 14px;margin-bottom:18px;letter-spacing:1px;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;background:#58a6ff;
    animation:blink 1.2s step-end infinite;
  }
  @keyframes blink{50%{opacity:.2}}

  /* ── title / text ─────────────────────────────── */
  .title{font-size:26px;font-weight:700;color:#e6edf3;letter-spacing:-0.5px;margin-bottom:10px}
  .desc{font-size:13px;color:#8b949e;line-height:1.8;margin-bottom:8px}

  /* ── buttons ──────────────────────────────────── */
  .actions{display:flex;gap:10px;justify-content:center;margin-top:32px}
  .btn{
    padding:12px 26px;border:none;border-radius:8px;font-family:inherit;
    font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;
    text-decoration:none;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:#1f6feb;color:#fff}
  .btn-primary:hover{background:#388bfd;box-shadow:0 0 18px #1f6feb44}

  /* ── footer ───────────────────────────────────── */
  .footer{text-align:center;font-size:11px;color:#484f58;margin-top:28px}

  /* ── responsive ───────────────────────────────── */
  @media(max-width:480px){
    .card{padding:36px 22px 28px}
    .big404{font-size:64px}
    .title{font-size:21px}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="header">
    <h1><span class="logo-dot"></span> TempShare</h1>
  </div>

  <div class="card">
    <div class="big404">404</div>

    <div class="magnifier">
      <svg viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10.5" cy="10.5" r="6.5"/>
        <line x1="15.5" y1="15.5" x2="21" y2="21" opacity=".7"/>
        <path d="M10.5 8v3" stroke-width="1.9"/>
        <path d="M10.5 14.2h.01" stroke-width="2.4"/>
      </svg>
    </div>

    <div class="status"><span class="dot"></span><span>404 NOT_FOUND</span></div>
    <div class="title">页面不存在</div>
    <div class="desc">
      您访问的页面可能已被移除、移动或从未存在过。<br>请检查网址是否正确，或返回首页继续。
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/">&#x21B5; 返回首页</a>
    </div>
  </div>

  <div class="footer">TempShare · 限时文件分享 · 文件到期后自动删除</div>
</div>

</body>
</html>
