<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接失效 · TempShare</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,monospace;
    background:#0b0c0e;color:#c9d1d9;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    overflow-x:hidden;
  }
  ::selection{background:#58a6ff33}

  /* ── background glow ──────────────────────────── */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bg::before{
    content:'';position:absolute;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle,#f8514911 0%,transparent 65%);
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .bg::after{
    content:'';position:absolute;width:100%;height:100%;
    background-image:
      linear-gradient(#30363d08 1px,transparent 1px),
      linear-gradient(90deg,#30363d08 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);
  }

  .container{position:relative;z-index:1;width:100%;max-width:560px;padding:24px}

  /* ── header ───────────────────────────────────── */
  .header{text-align:center;margin-bottom:28px}
  .header h1{
    font-size:22px;font-weight:600;color:#e6edf3;letter-spacing:-0.5px;
    display:inline-flex;align-items:center;gap:10px;
  }
  .header h1 .logo-dot{
    display:inline-block;width:14px;height:14px;border-radius:4px;
    background:linear-gradient(135deg,#f85149,#d2991d);
    box-shadow:0 0 14px #f8514955;
  }

  /* ── card ─────────────────────────────────────── */
  .card{
    background:#161b22;border:1px solid #30363d;border-radius:16px;
    padding:48px 40px 40px;text-align:center;position:relative;
    animation:cardIn .45s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,#f85149,transparent);
    border-radius:16px 16px 0 0;opacity:.6;
  }

  /* ── ghost icon ───────────────────────────────── */
  .ghost{
    width:88px;height:88px;margin:0 auto 24px;position:relative;
    animation:float 3.4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .ghost svg{width:100%;height:100%;filter:drop-shadow(0 8px 24px #f8514922)}
  .ghost .fade{
    position:absolute;bottom:-16px;left:50%;width:60px;height:10px;
    transform:translateX(-50%);border-radius:50%;
    background:#0006;filter:blur(6px);
    animation:fade 3.4s ease-in-out infinite;
  }
  @keyframes fade{0%,100%{opacity:.35;transform:translateX(-50%) scale(1)}50%{opacity:.15;transform:translateX(-50%) scale(.85)}}

  /* ── status code ──────────────────────────────── */
  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;color:#f85149;background:#f8514912;
    border:1px solid #f8514933;border-radius:6px;
    padding:6px 14px;margin-bottom:18px;letter-spacing:1px;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;background:#f85149;
    animation:blink 1.2s step-end infinite;
  }
  @keyframes blink{50%{opacity:.2}}

  /* ── title / text ─────────────────────────────── */
  .title{font-size:26px;font-weight:700;color:#e6edf3;letter-spacing:-0.5px;margin-bottom:10px}
  .desc{font-size:13px;color:#8b949e;line-height:1.8;margin-bottom:8px}
  .desc b{color:#c9d1d9;font-weight:500}

  /* ── meta row ─────────────────────────────────── */
  .meta{
    display:flex;justify-content:center;gap:10px;margin-top:22px;
    font-size:11px;color:#6e7681;flex-wrap:wrap;
  }
  .meta .chip{
    border:1px dashed #30363d;border-radius:6px;padding:5px 12px;
    display:inline-flex;align-items:center;gap:6px;
  }

  /* ── buttons ──────────────────────────────────── */
  .actions{display:flex;gap:10px;justify-content:center;margin-top:32px}
  .btn{
    padding:12px 26px;border:none;border-radius:8px;font-family:inherit;
    font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;
    text-decoration:none;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:#238636;color:#fff}
  .btn-primary:hover{background:#2ea043;box-shadow:0 0 18px #23863644}

  /* ── footer ───────────────────────────────────── */
  .footer{text-align:center;font-size:11px;color:#484f58;margin-top:28px}

  /* ── responsive ───────────────────────────────── */
  @media(max-width:480px){
    .card{padding:36px 22px 28px}
    .title{font-size:21px}
    .actions{flex-direction:column}
    .btn{justify-content:center}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <div class="header">
    <h1><span class="logo-dot"></span> TempShare</h1>
  </div>

  <div class="card">
    <div class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 21V10a8 8 0 0 1 16 0v11" opacity=".9"/>
        <path d="M4 17h16" opacity=".35"/>
        <circle cx="9.5" cy="12.5" r="1.1" fill="#f85149" stroke="none"/>
        <circle cx="14.5" cy="12.5" r="1.1" fill="#f85149" stroke="none"/>
        <path d="M9 15.5c.9.9 2 .9 3 0 1 .9 2.1.9 3 0" opacity=".7"/>
        <path d="M12 3v-2" opacity=".5"/>
        <path d="M8.5 4.5 7 3" opacity=".5"/>
        <path d="M15.5 4.5 17 3" opacity=".5"/>
      </svg>
      <div class="fade"></div>
    </div>

    <div class="status"><span class="dot"></span><span id="status-text">404 NOT_FOUND</span></div>
    <div class="title" id="title">文件不存在或已过期</div>
    <div class="desc" id="desc">
      该链接已被删除、已过期或从未存在过。<br>请向分享者确认，或返回首页生成新的链接。
    </div>

    <div class="meta">
      <span class="chip">&#x1F5C2;&nbsp;<span id="meta-file">未知文件</span></span>
      <span class="chip">&#x23F3;&nbsp;链接已失效</span>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/">&#x21B5; 返回首页</a>
    </div>
  </div>

  <div class="footer">TempShare · 限时文件分享 · 文件到期后自动删除</div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code') || '404';
  var title = q.get('title') || '文件不存在或已过期';
  var desc = q.get('desc') || '该链接已被删除、已过期或从未存在过。请向分享者确认，或返回首页生成新的链接。';
  var file = q.get('file') || '未知文件';

  var label = {
    '404': '404 NOT_FOUND',
    '410': '410 GONE'
  }[code] || (code + ' ERROR');

  document.getElementById('status-text').textContent = label;
  document.getElementById('title').textContent = title;
  document.getElementById('desc').innerHTML = desc.split('。').filter(Boolean).join('。<br>') || desc;
  document.getElementById('meta-file').textContent = file;

  document.title = title + ' · TempShare';
})();
</script>
</body>
</html>
